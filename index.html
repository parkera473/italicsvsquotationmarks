<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1a1a3e 0%, #0d0d22 100%);
      padding: 24px;
      gap: 40px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 30px rgba(150,180,255,0.4);
    }

    h1 span {
      color: #f5c518;
    }

    .subtitle {
      font-size: clamp(13px, 2vw, 16px);
      color: rgba(255,255,255,0.45);
      margin-top: 8px;
      font-weight: normal;
      font-family: Arial, sans-serif;
    }

    .cards {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      text-decoration: none;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      width: 260px;
      padding: 32px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: transform 0.18s, border-color 0.18s, background 0.18s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.09);
    }

    .card-icon {
      font-size: 56px;
      line-height: 1;
    }

    .card-title {
      font-size: clamp(16px, 2.5vw, 20px);
      color: #fff;
      text-align: center;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      line-height: 1.6;
      font-family: Arial, sans-serif;
      font-weight: normal;
    }

    .card-btn {
      margin-top: 6px;
      padding: 9px 28px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card-btn:hover {
      transform: scale(1.05);
    }

    .card--space { border-color: rgba(100,130,255,0.3); }
    .card--space:hover { border-color: rgba(100,130,255,0.6); }
    .card--space .card-btn {
      background: linear-gradient(135deg, #6a3de8, #2979d8);
      color: #fff;
      box-shadow: 0 0 18px rgba(100,130,255,0.4);
    }

    .card--carnival { border-color: rgba(200,50,50,0.3); }
    .card--carnival:hover { border-color: rgba(200,50,50,0.6); }
    .card--carnival .card-btn {
      background: linear-gradient(135deg, #cc1111, #f5c518);
      color: #fff;
      box-shadow: 0 0 18px rgba(245,197,24,0.3);
    }
  </style>
</head>
<body>

<header>
  <h1>🎮 <span>Game Hub</span></h1>
  <p class="subtitle">Choose a game to play</p>
</header>

<div class="cards">

  <a class="card card--space" href="italics-vs-quotes.html">
    <div class="card-icon">🚀</div>
    <div class="card-title"><em>Italics</em> vs. "Quotes"</div>
    <div class="card-desc">Land the rocket on the correct pad before it crashes into the terrain!</div>
    <button class="card-btn">Play</button>
  </a>

  <a class="card card--carnival" href="https://parkera473.github.io/down-the-clown/">
    <div class="card-icon">🎪</div>
    <div class="card-title">Down the Clown</div>
    <div class="card-desc">Upload your vocab words and knock down the clown with the right answer!</div>
    <button class="card-btn">Play</button>
  </a>

</div>

</body>
</html>
